[project]
name = "docupilot-ai-backend"
version = "0.1.0"
description = "Deterministic invoice-to-PO matching with model-assisted extraction."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10.3,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"